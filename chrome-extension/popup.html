
<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    h2 { font-size: 16px; margin-top: 0; }
    input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .status { font-size: 12px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h2>Activate Extension</h2>
  <p style="font-size: 12px; color: #666;">Please enter your GuardExt license key.</p>
  <input type="text" id="licenseInput" placeholder="EXT-XXXX-XXXX">
  <button id="activateBtn">Activate</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
